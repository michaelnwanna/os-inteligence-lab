name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Demo smoke test
        run: ail demo --devices 20000 --db /tmp/ail-smoke.db

  # Phase 8 exit criterion: real collectors on three operating systems feeding the same schema.
  agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Agent tests against the real OS
        run: pytest tests/unit/test_agent.py tests/integration/test_agent_e2e.py -v
      - name: Preview the payload this OS would send
        shell: bash
        env:
          AIL_AGENT_HOME: ${{ runner.temp }}/agent
        run: |
          ail agent enroll --yes
          ail agent preview

  # The .NET agent's collectors are separate code (P/Invoke on Windows), so they get their own three-OS run.
  dotnet-agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Agent tests against the real OS
        run: dotnet test dotnet/OsIntelligenceLab.sln -c Release --filter "FullyQualifiedName~AgentTests"
      - name: Preview the payload this OS would send
        shell: bash
        env:
          AIL_AGENT_HOME: ${{ runner.temp }}/agent-dotnet
        run: |
          dotnet dotnet/src/Ail.Cli/bin/Release/net10.0/ail.dll agent enroll --yes
          dotnet dotnet/src/Ail.Cli/bin/Release/net10.0/ail.dll agent preview

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build dotnet/OsIntelligenceLab.sln -c Release
      - name: Test (scenario acceptance, grounding, ingestion, API)
        run: dotnet test dotnet/OsIntelligenceLab.sln -c Release --no-build
      - name: Demo runs end to end
        run: dotnet dotnet/src/Ail.Cli/bin/Release/net10.0/ail.dll demo --devices 20000 --db "$RUNNER_TEMP/demo.db"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerabilities
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --local --skip-editable
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infrastructure/Dockerfile -t os-intelligence-lab .
      - name: Container starts and serves the portal
        run: |
          docker run -d --name ail -p 8000:8000 os-intelligence-lab
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/v1/incidents | grep -q AIL-1001
