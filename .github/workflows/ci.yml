name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Demo smoke test
        run: ail demo --devices 20000 --db /tmp/ail-smoke.db

  # Phase 8 exit criterion: real collectors on three operating systems feeding the same schema.
  agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Agent tests against the real OS
        run: pytest tests/unit/test_agent.py tests/integration/test_agent_e2e.py -v
      - name: Preview the payload this OS would send
        shell: bash
        env:
          AIL_AGENT_HOME: ${{ runner.temp }}/agent
        run: |
          ail agent enroll --yes
          ail agent preview

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerabilities
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --local --skip-editable
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/Dockerfile -t os-intelligence-lab .
      - name: Container starts and serves the portal
        run: |
          docker run -d --name ail -p 8000:8000 os-intelligence-lab
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/v1/incidents | grep -q AIL-1001
