[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-intelligence-lab"
version = "0.1.0"
description = "AI-powered failure intelligence for complex software systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ail = "ail_cli.main:main"

[tool.setuptools]
packages = [
    "ail_schemas",
    "ail_sdk",
    "ail_agent",
    "ail_simulator",
    "ail_ingestion",
    "ail_detection",
    "ail_investigation",
    "ail_api",
    "ail_cli",
]

[tool.setuptools.package-dir]
ail_schemas = "packages/schemas/ail_schemas"
ail_sdk = "packages/sdk/ail_sdk"
ail_agent = "packages/agent/ail_agent"
ail_simulator = "packages/simulator/ail_simulator"
ail_ingestion = "services/ingestion/ail_ingestion"
ail_detection = "services/detection/ail_detection"
ail_investigation = "services/investigation/ail_investigation"
ail_api = "services/api/ail_api"
ail_cli = "services/api/ail_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"services/detection/ail_detection/cohort.py" = ["E741"]  # N / O / E follow the scan-statistic notation
