id: scenario-001
name: No regression
description: >
  Healthy population. A benign application rollout and a benign driver update happen, but nothing
  degrades. A correct system raises no incident.
seed: 1
duration_minutes: 180
population:
  devices: 100000
  drivers: {"7.12": 0.5, "7.13": 0.5}
rollouts:
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 90
    ramp_minutes: 20
    max_exposure: 0.6
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 112
    ramp_minutes: 20
    max_exposure: 0.2
    repository: fixture/atlas
    base_ref: v2.0
    head_ref: v2.1
expected:
  incidents: 0
