id: heldout-03
name: Mild regression across a large cohort
description: >
  Application 2.1 triples the failure rate (0.4% to 1.2%) on every architecture. Large cohort, small effect.
seed: 103
duration_minutes: 180
population:
  devices: 100000
rollouts:
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 90
    ramp_minutes: 20
    max_exposure: 0.4
effects:
  - id: fx-app21
    where: {application_version: "2.1"}
    failure_rate: 0.012
expected:
  incidents: 1
  effect_start_minute: 90
  cohort: {application_version: "2.1"}
  trigger: dep-app-2.1
  metric: failure_rate
