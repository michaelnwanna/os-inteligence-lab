id: heldout-08
name: Regression that is rolled back
description: >
  App 2.1 breaks devices on OS 12.4, and the release is rolled back 50 minutes later. The incident should
  be found and marked resolved.
seed: 108
duration_minutes: 240
population:
  devices: 80000
  os_versions: {"12.4": 0.5, "12.5": 0.5}
rollouts:
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 100
    ramp_minutes: 15
    max_exposure: 0.4
effects:
  - id: fx-os124
    where: {application_version: "2.1", os_version: "12.4"}
    start_minute: 100
    end_minute: 150
    failure_rate: 0.07
    signature: "TIMEOUT|Net.Fetch"
expected:
  incidents: 1
  effect_start_minute: 100
  cohort: {application_version: "2.1", os_version: "12.4"}
  trigger: dep-app-2.1
  metric: failure_rate
