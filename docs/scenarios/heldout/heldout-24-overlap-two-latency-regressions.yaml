id: heldout-24
name: Two overlapping latency regressions
description: >
  x64 + driver 7.14 gets 1.6x slower at minute 100 and OS 12.4 + App 2.1 gets 1.5x slower at minute 120, with no
  change in failures. Both incidents are on the latency metric.
seed: 124
duration_minutes: 200
population:
  devices: 100000
  os_versions: {"12.4": 0.5, "12.5": 0.5}
rollouts:
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 100
    ramp_minutes: 10
    max_exposure: 0.5
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 120
    ramp_minutes: 10
    max_exposure: 0.5
effects:
  - id: fx-x64-latency
    where: {architecture: x64, driver_version: "7.14"}
    latency_multiplier: 1.6
  - id: fx-app-os-latency
    where: {application_version: "2.1", os_version: "12.4"}
    latency_multiplier: 1.5
expected:
  incidents: 2
  episodes:
    - effect_start_minute: 100
      cohort: {architecture: x64, driver_version: "7.14"}
      trigger: drv-7.14
      metric: latency_ms
    - effect_start_minute: 120
      cohort: {application_version: "2.1", os_version: "12.4"}
      trigger: dep-app-2.1
      metric: latency_ms
