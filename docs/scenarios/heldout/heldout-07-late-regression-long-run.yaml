id: heldout-07
name: Late regression in a six-hour run
description: >
  A six-hour run where an x86 + App 2.1 regression starts at minute 280, after a long uneventful baseline
  that includes a benign driver rollout.
seed: 107
duration_minutes: 360
population:
  devices: 60000
rollouts:
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 120
    ramp_minutes: 30
    max_exposure: 0.5
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 280
    ramp_minutes: 15
    max_exposure: 0.4
effects:
  - id: fx-x86
    where: {architecture: x86, application_version: "2.1"}
    failure_rate: 0.10
    signature: "UNHANDLED_EXCEPTION|Core.Dispatch"
expected:
  incidents: 1
  effect_start_minute: 280
  cohort: {architecture: x86, application_version: "2.1"}
  trigger: dep-app-2.1
  metric: failure_rate
