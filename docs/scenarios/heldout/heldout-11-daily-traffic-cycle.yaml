id: heldout-11
name: Regression during a strong traffic cycle
description: >
  A six-hour run whose traffic swings between 0.6x and 2.0x. An ARM64 + App 2.1 regression starts at minute
  250, at the traffic peak. Traffic changes alone must not raise incidents.
seed: 111
duration_minutes: 360
population:
  devices: 60000
rollouts:
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 250
    ramp_minutes: 15
    max_exposure: 0.3
traffic:
  - {start_minute: 60, end_minute: 120, multiplier: 0.6}
  - {start_minute: 180, end_minute: 240, multiplier: 1.6}
  - {start_minute: 240, end_minute: 300, multiplier: 2.0}
  - {start_minute: 300, end_minute: 360, multiplier: 1.3}
effects:
  - id: fx-arm64
    where: {architecture: arm64, application_version: "2.1"}
    failure_rate: 0.09
expected:
  incidents: 1
  effect_start_minute: 250
  cohort: {architecture: arm64, application_version: "2.1"}
  trigger: dep-app-2.1
  metric: failure_rate
