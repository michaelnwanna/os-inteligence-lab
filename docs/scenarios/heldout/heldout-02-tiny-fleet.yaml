id: heldout-02
name: Tiny fleet, severe regression
description: >
  Only 5,000 devices, so the affected cohort is about 400 devices. A severe ARM64 + App 2.1 regression
  must still be found with little data.
seed: 102
duration_minutes: 150
population:
  devices: 5000
rollouts:
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 85
    ramp_minutes: 10
    max_exposure: 0.4
effects:
  - id: fx-arm64
    where: {architecture: arm64, application_version: "2.1"}
    failure_rate: 0.15
    signature: "OOM_KILL|MemoryCache.Allocate"
expected:
  incidents: 1
  effect_start_minute: 85
  cohort: {architecture: arm64, application_version: "2.1"}
  trigger: dep-app-2.1
  metric: failure_rate
