id: heldout-14
name: A failure regression and a latency regression together
description: >
  ARM64 + App 2.1 raises failures at minute 100. Five minutes later x64 + driver 7.14 becomes 1.7x slower
  without any extra failures. Two incidents, on two different metrics.
seed: 114
duration_minutes: 180
population:
  devices: 100000
rollouts:
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 100
    ramp_minutes: 10
    max_exposure: 0.3
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 105
    ramp_minutes: 10
    max_exposure: 0.4
effects:
  - id: fx-arm64
    where: {architecture: arm64, application_version: "2.1"}
    failure_rate: 0.09
  - id: fx-x64-latency
    where: {architecture: x64, driver_version: "7.14"}
    latency_multiplier: 1.7
expected:
  incidents: 2
  episodes:
    - effect_start_minute: 100
      cohort: {architecture: arm64, application_version: "2.1"}
      trigger: dep-app-2.1
      metric: failure_rate
    - effect_start_minute: 105
      cohort: {architecture: x64, driver_version: "7.14"}
      trigger: drv-7.14
      metric: latency_ms
