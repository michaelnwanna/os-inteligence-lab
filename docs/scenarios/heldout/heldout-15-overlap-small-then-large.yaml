id: heldout-15
name: Small severe cohort, then a large mild cohort that overlaps it
description: >
  arm64 + driver 7.14 (a small slice) breaks badly at minute 90. Thirty minutes later OS 12.4 + App 2.1 (a much
  larger slice) breaks mildly. A device on arm64, driver 7.14, OS 12.4 and app 2.1 is in both cohorts.
seed: 115
duration_minutes: 180
population:
  devices: 100000
  os_versions: {"12.4": 0.5, "12.5": 0.5}
rollouts:
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 90
    ramp_minutes: 10
    max_exposure: 0.5
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 120
    ramp_minutes: 15
    max_exposure: 0.5
effects:
  - id: fx-arm64-driver
    where: {architecture: arm64, driver_version: "7.14"}
    failure_rate: 0.12
  - id: fx-app-os
    where: {application_version: "2.1", os_version: "12.4"}
    failure_rate: 0.025
expected:
  incidents: 2
  episodes:
    - effect_start_minute: 90
      cohort: {architecture: arm64, driver_version: "7.14"}
      trigger: drv-7.14
      metric: failure_rate
    - effect_start_minute: 120
      cohort: {application_version: "2.1", os_version: "12.4"}
      trigger: dep-app-2.1
      metric: failure_rate
