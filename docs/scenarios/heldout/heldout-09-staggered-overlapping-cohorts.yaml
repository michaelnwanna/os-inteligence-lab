id: heldout-09
name: Two regressions twenty minutes apart on overlapping cohorts
description: >
  x64 + driver 7.14 breaks at minute 100. At minute 120 App 2.1 breaks on OS 12.4. The two cohorts overlap
  (an x64 device on driver 7.14, app 2.1 and OS 12.4 is in both) and differ in size.
seed: 109
duration_minutes: 180
population:
  devices: 100000
  os_versions: {"12.4": 0.5, "12.5": 0.5}
rollouts:
  - id: drv-7.14
    kind: driver_update
    component: gfx-driver
    dimension: driver_version
    from_version: "7.13"
    to_version: "7.14"
    at_minute: 100
    ramp_minutes: 10
    max_exposure: 0.35
  - id: dep-app-2.1
    kind: app_deployment
    component: Atlas
    dimension: application_version
    from_version: "2.0"
    to_version: "2.1"
    at_minute: 120
    ramp_minutes: 15
    max_exposure: 0.25
effects:
  - id: fx-x64-driver
    where: {architecture: x64, driver_version: "7.14"}
    failure_rate: 0.05
  - id: fx-app-os
    where: {application_version: "2.1", os_version: "12.4"}
    failure_rate: 0.08
expected:
  incidents: 2
  episodes:
    - effect_start_minute: 100
      cohort: {architecture: x64, driver_version: "7.14"}
      trigger: drv-7.14
      metric: failure_rate
    - effect_start_minute: 120
      cohort: {application_version: "2.1", os_version: "12.4"}
      trigger: dep-app-2.1
      metric: failure_rate
